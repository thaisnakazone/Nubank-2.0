name: Refresh processed data

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "data/raw/pillar3/**"
      - "src/ingest_pillar3.py"
      - ".github/workflows/refresh-processed-data.yml"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Rebuild regulatory processed dataset
        run: python src/ingest_pillar3.py

      - name: Commit processed dataset when changed
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/processed/capital_risk_history_long.csv
          if git diff --cached --quiet; then
            echo "Processed dataset is already current."
            exit 0
          fi
          git commit -m "data: refresh processed Pilar 3 history"
          git push origin "HEAD:${GITHUB_REF_NAME}"
