name: Reclamações BCB

on:
  schedule:
    # Toda segunda-feira às 12:00 UTC: o BCB publica o ranking trimestralmente,
    # então uma checagem semanal basta para pegar novos trimestres.
    - cron: '0 12 * * 1'
  push:
    branches: [main]
    paths:
      - "src/ingest_bcb_ranking.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ingestao-bcb:
    name: Ranking de reclamações do Banco Central → MongoDB Atlas
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Instalar dependências
        run: python -m pip install -r requirements.txt

      - name: Coletar ranking e irregularidades no site do BCB
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
        run: python -m src.ingest_bcb_ranking

      - name: Versionar arquivos processados
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/processed/bcb_ranking.csv data/processed/bcb_irregularidades.csv 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Nenhuma novidade no ranking do BCB."
            exit 0
          fi
          git commit -m "chore(data): atualização do ranking de reclamações do BCB"
          git push origin "HEAD:${GITHUB_REF_NAME}"
