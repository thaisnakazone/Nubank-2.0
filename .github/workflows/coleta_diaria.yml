name: Coleta Diária de Cotações

on:
  schedule:
    # Executa de segunda a sexta-feira às 22:00 UTC (19:00 no horário de Brasília - BRT),
    # logo após o fechamento da B3 (17:00/18:00 BRT) e NYSE (16:00 EST / 21:00 UTC)
    # Formato cron: minuto hora dia-do-mês mês dia-da-semana (1 = segunda-feira, 5 = sexta-feira)
    - cron: '0 22 * * 1-5'
  workflow_dispatch: # Permite disparo manual diretamente pela aba Actions do GitHub

permissions:
  contents: write

jobs:
  coleta-e-ingestao:
    name: Ingestão de Cotações OHLCV e Atualização do Dashboard
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar o ambiente Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar script de ingestão da API Twelve Data para MongoDB Atlas
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        run: |
          python ingestao.py

      - name: Reconstruir payload do dashboard a partir do MongoDB Atlas
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
        run: |
          python -m src.build_web_data

      - name: Commit e atualização periódica dos dados do dashboard
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/dashboard-data.json
          if git diff --cached --quiet; then
            echo "Dashboard já se encontra com a versão mais recente dos dados."
            exit 0
          fi
          git commit -m "chore(data): atualização automática do dashboard via Twelve Data e MongoDB Atlas"
          git push origin "HEAD:${GITHUB_REF_NAME}"
